name: dxchat-whatsapi

services:
  whatsapi:
    image: ${WHATSAPI_IMAGE:-gustavowlimadev/whatsapi:develop}
    container_name: dxchat-whatsapi
    environment:
      PORT: "8080"
      DEBUG_MODE: ${WHATSAPI_DEBUG_MODE:-false}
      DEBUG_WHATSMEOW: ${WHATSAPI_DEBUG_WHATSMEOW:-false}
      REDIS_URL: whatsapi-redis:6379
      REDIS_PASSWORD: ""
      REDIS_TLS: "false"
      API_KEY: ${API_KEY:-default}
      DIALECT_DB: sqlite3
      DB_URL: "file:/app/data/data.db?_foreign_keys=on"
      GCS_ENABLED: "false"
      GCL_ENABLED: "false"
      EMITTER_BUFFER_SIZE: ${WHATSAPI_EMITTER_BUFFER_SIZE:-2048}
      EMITTER_WORKERS: ${WHATSAPI_EMITTER_WORKERS:-50}
      HANDLER_SEMAPHORE_SIZE: ${WHATSAPI_HANDLER_SEMAPHORE_SIZE:-512}
      PROXY_ADDRESSES: ${WHATSAPI_PROXY_ADDRESSES:-}
      PROXY_STRATEGY: ${WHATSAPI_PROXY_STRATEGY:-RANDOM}
      PROXY_NO_MEDIA: ${WHATSAPI_PROXY_NO_MEDIA:-false}
    ports:
      - "${WHATSAPI_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - whatsapi_data:/app/data
    depends_on:
      whatsapi-redis:
        condition: service_healthy
    networks:
      - default
      - dxchat
    restart: unless-stopped

  whatsapi-redis:
    image: redis:8-alpine
    container_name: dxchat-whatsapi-redis
    command: redis-server --appendonly yes
    volumes:
      - whatsapi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  whatsapi_data:
  whatsapi_redis_data:

networks:
  dxchat:
    external: true
    name: dxchat_default
